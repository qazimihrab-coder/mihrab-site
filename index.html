<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MRr MihRab</title>

  <meta name="description" content="MRr MihRab - صفحه شخصی و شبکه‌های اجتماعی">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #101827 0%, #050810 45%, #02040a 100%);
      color: white;
      overflow-x: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: #1d4ed8;
      filter: blur(120px);
      opacity: 0.16;
      top: -100px;
      left: -80px;
    }

    .glow2 {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: #7c3aed;
      filter: blur(120px);
      opacity: 0.13;
      bottom: -80px;
      right: -70px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 25px 18px 35px;
    }

    .card {
      width: 100%;
      padding: 35px 22px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      background: rgba(10,15,27,0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.45);
      text-align: center;
    }

    /* Profile */
    .profile {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(135deg, #111827, #2563eb, #7c3aed);

      border: 3px solid rgba(255,255,255,0.18);
      box-shadow:
        0 0 35px rgba(37,99,235,0.35),
        inset 0 0 25px rgba(255,255,255,0.08);

      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .name {
      font-size: clamp(35px, 10vw, 58px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .name span {
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .username {
      direction: ltr;
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 22px;
    }

    .bio {
      font-size: 17px;
      line-height: 2;
      color: #e2e8f0;
      margin: 0 auto 28px;
      max-width: 550px;
    }

    /* Buttons */
    .socials {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 12px 10px;

      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 16px;

      background: rgba(255,255,255,0.055);

      font-size: 15px;
      font-weight: 650;

      transition: 0.25s ease;
    }

    .social:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.1);
      border-color: rgba(96,165,250,0.55);
    }

    .icon {
      direction: ltr;
      font-size: 20px;
      margin-left: 8px;
    }

    /* Special Telegram button */
    .telegram {
      border-color: rgba(59,130,246,0.35);
    }

    .whatsapp {
      border-color: rgba(34,197,94,0.35);
    }

    .instagram {
      border-color: rgba(236,72,153,0.35);
    }

    .tiktok {
      border-color: rgba(255,255,255,0.25);
    }

    .facebook {
      border-color: rgba(59,130,246,0.35);
    }

    /* Info section */
    .info {
      margin-top: 25px;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .info-title {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .info-text {
      color: #cbd5e1;
      font-size: 14px;
      direction: ltr;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.8;
    }

    footer strong {
      color: #94a3b8;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .container {
        padding: 14px 12px 25px;
      }

      .card {
        padding: 30px 15px;
        border-radius: 24px;
      }

      .avatar {
        width: 105px;
        height: 105px;
        font-size: 32px;
      }

      .name {
        font-size: 39px;
      }

      .bio {
        font-size: 15px;
        line-height: 1.9;
      }

      .socials {
        grid-template-columns: 1fr;
      }

      .social {
        min-height: 52px;
      }
    }
  </style>
</head>

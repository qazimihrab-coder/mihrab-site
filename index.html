    <!-- Clock -->
    <script>

        function updateTime() {

            const now = new Date();

            document.getElementById("clock").textContent =
                now.toLocaleTimeString("fa-IR", {
                    hour12: false
                });

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-GB", {
                    day: "2-digit",
                    month: "short"
                });
        }

        updateTime();

        setInterval(updateTime, 1000);
